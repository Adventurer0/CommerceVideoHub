[project]
name = "commerce-video-hub"
version = "0.1.0"
description = "Windows local-only commerce video workspace (G1 scaffold)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
]

[project.optional-dependencies]
browser = ["playwright>=1.58,<2"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1", "mypy>=1.17,<2", "playwright>=1.58,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["audit-install"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app/backend"]
exclude = ["app/backend/migrations/versions"]
